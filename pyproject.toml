[project]
name = "beets-originquery"
version = "1.0.2"
description = "Integrates origin.txt metadata into beets MusicBrainz queries"
readme = "README.md"
authors = [
    { name = "x1ppy" },
]
requires-python = ">=3.10"
dependencies = [
    "beets>=2.5.1",
    "confuse>=2.1.0",
    "jsonpath-rw>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetsplug"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]
