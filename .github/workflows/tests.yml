name: Tests

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9"

      - name: Install dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check
